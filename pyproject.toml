[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "esun-event-agent"
version = "0.1.0"
description = "AI CUP 2026 主動台股事件傳導精選 Agent"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "pydantic>=2.10,<3"]

[project.scripts]
esun-agent = "esun_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/esun_agent"]
